name: ci
on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pin third-party workflow code to immutable commits. The comments retain
      # the human-readable release line for update tooling and reviewers.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'

      # Unit tests. No Project Zomboid jars needed - anything that touches
      # zombie.* is verified in-game instead, see dev/README.md.
      - name: Unit tests
        run: ./tools/test.sh

      # Version integrity, jar contents, secret scan.
      - name: Release verification
        run: ./tools/verify.sh

      - name: Shell syntax
        run: for f in build.sh tools/*.sh; do bash -n "$f"; done

      - name: Lua syntax
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4
          luac5.4 -p mod/42/media/lua/client/PZStory/PZStoryBook.lua
          luac5.4 -p dev/PZStory_Probe.lua

      - name: Trailing whitespace
        run: |
          if git grep -nI ' $' -- '*.java' '*.lua' '*.sh' '*.md'; then
            echo "trailing whitespace above"; exit 1
          fi
